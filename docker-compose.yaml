services:
  # Core application services - available in all profiles
  mariadb:
    image: mariadb:10.5
    container_name: mariadb
    profiles: ["core", "gvm", "darkstar", "scanner"]
    entrypoint: ["/bin/bash", "/usr/local/bin/darkstar-mariadb-entrypoint.sh"]
    command: ["mysqld"]
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/mariadb-entrypoint.sh:/usr/local/bin/darkstar-mariadb-entrypoint.sh:ro
      - ./sql/init-darkstar.sh:/docker-entrypoint-initdb.d/10-init-darkstar.sh:ro
      - ./sql/init.sql:/docker-entrypoint-initdb.d/darkstar-schema.sql.template:ro
      - mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - vuln_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Core OpenVAS infrastructure - essential for GVM operations
  redis-server:
    image: registry.community.greenbone.net/community/redis-server
    profiles: ["core", "gvm", "darkstar"]
    restart: unless-stopped
    volumes:
      - redis_socket_vol:/run/redis/
    networks:
      - vuln_net

  pg-gvm:
    image: registry.community.greenbone.net/community/pg-gvm:stable
    profiles: ["gvm", "darkstar"]
    restart: unless-stopped
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h /var/run/postgresql -d gvmd"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - vuln_net

  # Required by current pg-gvm images when an existing volume uses an older
  # PostgreSQL major version. It exits without changes when no migration is due.
  pg-gvm-migrator:
    image: registry.community.greenbone.net/community/pg-gvm-migrator:stable
    profiles: ["gvm", "darkstar"]
    restart: "no"
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql
    networks:
      - vuln_net

  # OpenVAS data containers (these will initialize and exit)
  vulnerability-tests:
    image: registry.community.greenbone.net/community/vulnerability-tests
    profiles: ["gvm", "darkstar"]
    environment:
      FEED_RELEASE: "24.10"
    volumes:
      - vt_data_vol:/mnt
    networks:
      - vuln_net

  notus-data:
    image: registry.community.greenbone.net/community/notus-data
    profiles: ["gvm", "darkstar"]
    volumes:
      - notus_data_vol:/mnt
    networks:
      - vuln_net

  scap-data:
    image: registry.community.greenbone.net/community/scap-data
    profiles: ["gvm", "darkstar"]
    volumes:
      - scap_data_vol:/mnt
    networks:
      - vuln_net

  cert-bund-data:
    image: registry.community.greenbone.net/community/cert-bund-data
    profiles: ["gvm", "darkstar"]
    volumes:
      - cert_data_vol:/mnt
    networks:
      - vuln_net

  dfn-cert-data:
    image: registry.community.greenbone.net/community/dfn-cert-data
    profiles: ["gvm", "darkstar"]
    volumes:
      - cert_data_vol:/mnt
    depends_on:
      - cert-bund-data
    networks:
      - vuln_net

  data-objects:
    image: registry.community.greenbone.net/community/data-objects
    profiles: ["gvm", "darkstar"]
    environment:
      FEED_RELEASE: "24.10"
    volumes:
      - data_objects_vol:/mnt
    networks:
      - vuln_net

  report-formats:
    image: registry.community.greenbone.net/community/report-formats
    profiles: ["gvm", "darkstar"]
    environment:
      FEED_RELEASE: "24.10"
    volumes:
      - data_objects_vol:/mnt
    depends_on:
      - data-objects
    networks:
      - vuln_net

  gpg-data:
    image: registry.community.greenbone.net/community/gpg-data
    profiles: ["gvm", "darkstar"]
    volumes:
      - gpg_data_vol:/mnt
    networks:
      - vuln_net

  # Core GVM services
  gvmd:
    image: registry.community.greenbone.net/community/gvmd:stable
    profiles: ["gvm", "darkstar"]
    restart: unless-stopped
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data/
      - cert_data_vol:/var/lib/gvm/cert-data
      - data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - vt_data_vol:/var/lib/openvas/plugins
      - psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_healthy
      scap-data:
        condition: service_completed_successfully
      cert-bund-data:
        condition: service_completed_successfully
      dfn-cert-data:
        condition: service_completed_successfully
      data-objects:
        condition: service_completed_successfully
      report-formats:
        condition: service_completed_successfully
    healthcheck:
      # A stale socket file survives in the shared volume when gvmd cannot
      # reach PostgreSQL.  Connect to it instead of merely checking it exists.
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(socket.AF_UNIX); s.settimeout(5); s.connect('/run/gvmd/gvmd.sock'); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - vuln_net

  # OpenVAS scanner configuration
  configure-openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    profiles: ["gvm", "darkstar"]
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log
    networks:
      - vuln_net

  # OpenVAS scanner daemon
  openvasd:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    profiles: ["gvm", "darkstar"]
    restart: unless-stopped
    environment:
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - notus_data_vol:/var/lib/notus
    depends_on:
      vulnerability-tests:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
    networks:
      vuln_net:
        aliases:
          - openvasd

  # OpenVAS Scanner Protocol Daemon
  ospd-openvas:
    image: registry.community.greenbone.net/community/ospd-openvas:stable
    profiles: ["gvm", "darkstar"]
    restart: unless-stopped
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
      ]
    volumes:
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    depends_on:
      redis-server:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
    networks:
      - vuln_net

  # OpenVAS Web Interface
  gsa:
    image: registry.community.greenbone.net/community/gsa:stable
    profiles: ["gvm", "darkstar"]
    restart: on-failure
    ports:
      - "9392:9392"
    volumes:
      - gvmd_socket_vol:/run/gvmd
    depends_on:
      - gvmd
    networks:
      - vuln_net

  # GVM Tools for command line access
  gvm-tools:
    image: registry.community.greenbone.net/community/gvm-tools
    profiles: ["gvm", "darkstar"]
    volumes:
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
    depends_on:
      - gvmd
      - ospd-openvas
    networks:
      - vuln_net

  # Custom OpenVAS API
  openvas-api:
    build:
      context: ./openvas_api
      dockerfile: Dockerfile
    container_name: openvas-api
    profiles: ["gvm", "darkstar"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GVM_USER: ${OPENVAS_USER:-admin}
      GVM_PASSWORD: ${OPENVAS_PASS:-admin}
      GMP_SOCKET: /run/gvmd/gvmd.sock
    ports:
      - "8008:8008"
    volumes:
      - gvmd_socket_vol:/run/gvmd 
      - ./openvas_api:/app
    depends_on:
      gvmd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 30s
    networks:
      - vuln_net

  # Main Darkstar application
  darkstar:
    image: darkstar-darkstar
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: darkstar
    profiles: ["core", "gvm", "darkstar"]
    working_dir: /app
    env_file:
      - .env
    ports:
      - "7373:7373"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - vuln_net
    volumes:
      - ./darkstar:/app/darkstar
      - ./data:/app/data
      - ./logo_darkstar.png:/app/logo_darkstar.png:ro
      - ./logo_sidn.png:/app/logo_sidn.png:ro
      - ./logo_nlnet.png:/app/logo_nlnet.png:ro
    restart: unless-stopped
    tty: true
    stdin_open: true
    command: tail -f /dev/null

  # Darkstar web dashboard
  darkstar-web:
    image: darkstar-darkstar
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: darkstar-web
    profiles: ["core", "gvm", "darkstar"]
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/darkstar
      DARKSTAR_SCANNER_IMAGE: ${DARKSTAR_SCANNER_IMAGE:-darkstar-darkstar}
      DARKSTAR_SCANNER_NETWORK: ${DARKSTAR_SCANNER_NETWORK:-darkstar_vuln_net}
      DARKSTAR_SCANNER_ATTACH_DIR: /app/data/scanner-env
      DARKSTAR_SCANNER_ATTACH_HOST_DIR: ./data/scanner-env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/documentation"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - vuln_net
    volumes:
      - ./darkstar:/app/darkstar
      - ./data:/app/data
      - ./logo_darkstar.png:/app/logo_darkstar.png:ro
      - ./logo_sidn.png:/app/logo_sidn.png:ro
      - ./logo_nlnet.png:/app/logo_nlnet.png:ro
      - ./.env:/app/.env:ro
    restart: unless-stopped
    command: uvicorn darkstar.webapp:app --host 0.0.0.0 --port 8080

  # Bundled scanner worker. Runs by default so scans execute out of the box
  # instead of sitting "Queued for scanner workers". When DARKSTAR_SCANNER_TOKEN
  # is empty it auto-provisions a local "local-scanner" node and caches the token
  # in the scanner_state volume. Set DARKSTAR_SCANNER_TOKEN (e.g. via
  # scanner_attach) to pin a specific token or run this as a remote worker.
  darkstar-scanner:
    image: darkstar-darkstar
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: darkstar-scanner
    profiles: ["core", "gvm", "darkstar", "scanner"]
    working_dir: /app
    env_file:
      - .env
    environment:
      PYTHONPATH: /app:/app/darkstar
      DARKSTAR_ORCHESTRATOR_URL: ${DARKSTAR_ORCHESTRATOR_URL:-http://darkstar-web:8080}
      DARKSTAR_SCANNER_TOKEN: ${DARKSTAR_SCANNER_TOKEN:-}
      DARKSTAR_SCANNER_NAME: ${DARKSTAR_SCANNER_NAME:-local-scanner}
      DARKSTAR_WORKER_MAX_PARALLEL: ${DARKSTAR_WORKER_MAX_PARALLEL:-1}
      DARKSTAR_SCANNER_TOKEN_FILE: ${DARKSTAR_SCANNER_TOKEN_FILE:-/var/lib/darkstar-scanner/local-scanner.token}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - vuln_net
    volumes:
      - ./darkstar:/app/darkstar
      - ./data:/app/data
      - ./logo_darkstar.png:/app/logo_darkstar.png:ro
      - ./logo_sidn.png:/app/logo_sidn.png:ro
      - ./logo_nlnet.png:/app/logo_nlnet.png:ro
      - ./.env:/app/.env:ro
      - scanner_state_vol:/var/lib/darkstar-scanner
    restart: unless-stopped
    command: >
      /bin/bash -lc 'if [ -z "$$DARKSTAR_SCANNER_TOKEN" ];
      then export DARKSTAR_SCANNER_TOKEN="$$(python3 -m darkstar.scanner_bootstrap)";
      fi;
      if [ -z "$$DARKSTAR_SCANNER_TOKEN" ];
      then echo "Scanner token bootstrap failed; see logs above."; sleep infinity;
      else exec python3 -m darkstar.scanner_worker;
      fi'

volumes:
  mariadb_data:
  scanner_state_vol:
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  gvmd_data_vol:
  psql_data_vol:
  vt_data_vol:
  notus_data_vol:
  psql_socket_vol:
  gvmd_socket_vol:
  ospd_openvas_socket_vol:
  redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:

networks:
  vuln_net:
    driver: bridge
