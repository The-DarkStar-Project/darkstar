name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-smoke:
    name: Unit and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate all Compose profiles
        run: |
          cp .env.example .env
          docker compose --profile core config --quiet
          docker compose --profile scanner config --quiet
          docker compose --profile gvm config --quiet
          docker compose --profile darkstar config --quiet

      - name: Run unit and smoke tests
        run: python -m pytest -m "not playwright" --junitxml=test-results/pytest-unit-smoke.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unit-smoke
          path: test-results/pytest-unit-smoke.xml

  playwright:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          RUN_PLAYWRIGHT: "1"
        run: python -m pytest -m playwright --junitxml=test-results/pytest-playwright.xml

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/pytest-playwright.xml
            test-results/playwright/

  scanner-image:
    name: Scanner image contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build scanner image from pinned inputs
        run: docker build -f docker/Dockerfile -t darkstar:test .

      - name: Verify image dependency and CVE data contracts
        run: |
          docker run --rm darkstar:test python3 -m pip check
          docker run --rm darkstar:test test -x /app/darkstar/tools/scripts/search_epss
          docker run --rm darkstar:test test -s /app/darkstar/data/epps_scores-current.csv
          docker run --rm darkstar:test test -s /app/darkstar/data/known_exploited_vulnerabilities.csv
